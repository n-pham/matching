[package]
name = "my_dioxus_app"
version = "0.1.0"
edition = "2021"

[dependencies]
# The Core UI Framework (2026 Stable)
# Use default features which includes 'lib' (core: macro, signals, hooks, html)
# For web: add 'web' feature
# For server: add 'fullstack' feature (pulls in server deps)
dioxus = { version = "0.7.3", features = ["router", "web"] }
dioxus-fullstack = { version = "0.7.3", optional = true }
dioxus-server = { version = "0.7.3", optional = true }

# Data Serialization (Crucial for Server Functions)
serde = { version = "1.0", features = ["derive"] }

# Backend Web Server Integration
# Dioxus handles the glue, but Axum is the engine.
axum = { version = "0.8.0", optional = true }
tokio = { version = "1.40", features = ["full", "macros"], optional = true }

# Database (Compile-time safety for your SQL)
# Features match common 2026 requirements
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls", 
    "postgres", 
    "macros", 
    "chrono", 
    "uuid"
], optional = true }

# Shared Utilities
tracing = "0.1"
log = "0.4"
rand = { version = "0.8", features = ["getrandom"] }
getrandom = { version = "0.2", features = ["js"] }
futures-timer = "3.0"

[features]
default = ["web"]
# The 'web' feature: Compiled for the browser (Wasm)
web = []
# The 'desktop' feature: Compiled for a native window
desktop = ["dioxus/desktop"]
# The 'server' feature: Compiled for the binary (Axum + SQLx)
server = [
    "dep:axum",
    "dep:tokio",
    "dep:sqlx",
    "dioxus/fullstack",
    "dioxus-fullstack",
    "dioxus-server"
]

[dev-dependencies]
dioxus-ssr = "0.7.3"

[profile.release]
# Optimize for small Wasm binaries
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'