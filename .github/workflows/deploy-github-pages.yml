name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          cache: true

      - name: Cache cargo install (dioxus-cli, wasm-opt)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/dioxus-cli
            ~/.cargo/bin/wasm-opt
          key: cargo-install-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install Dioxus CLI
        run: |
          if ! command -v dioxus-cli &> /dev/null; then
            cargo install dioxus-cli --version 0.7.3
          else
            echo "dioxus-cli already installed"
          fi

      - name: Install wasm-opt (for smaller builds)
        run: |
          if ! command -v wasm-opt &> /dev/null; then
            cargo install wasm-opt --version 0.116.0
          else
            echo "wasm-opt already installed"
          fi

      - name: Use GitHub Pages config
        run: cp Dioxus.github.toml Dioxus.toml

      - name: Build Web (WASM) for GitHub Pages
        run: dx bundle --platform web --release

      - name: Copy build output to docs/
        run: |
          mkdir -p docs
          cp -r target/dx/my_dioxus_app/release/web/public/* docs/

      - name: Verify build output
        run: |
          ls -la docs/
          test -f docs/index.html
          test -n "$(find docs/assets -maxdepth 1 -name '*.wasm' -print -quit)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4